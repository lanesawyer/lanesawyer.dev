app = 'lanesawyer-dev'
primary_region = 'sjc'

[build]

[env]
PORT = "8080"
HOST = "0.0.0.0"

# Media uploads live on this volume, so the app must stay at one machine.
[mounts]
source = 'emdash_data'
destination = '/data'

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
